# Обычные настройки локальной сборки; отдельного RAM-профиля нет.
org.gradle.jvmargs=-Xmx384m -XX:MaxMetaspaceSize=256m -Dfile.encoding=UTF-8
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.daemon=false
# IDEA использует daemon через Tooling API даже при daemon=false: убираем его после простоя.
org.gradle.daemon.idletimeout=60000
